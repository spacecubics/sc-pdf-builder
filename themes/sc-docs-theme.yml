extends: default

# General page and typography
page:
  layout: portrait
  size: A4
  margin: [18mm, 16mm, 20mm, 18mm]
  background-color: FFFFFF

font:
  catalog:
    merge: true
    Noto Sans JP:
      normal: NotoSansJP-Regular.ttf
      italic: NotoSansJP-Regular.ttf
      bold: NotoSansJP-Bold.ttf
      bold_italic: NotoSansJP-Bold.ttf
    Sarasa Mono J:
      normal: SarasaMonoJ-Regular.ttf
      italic: SarasaMonoJ-Italic.ttf
      bold: SarasaMonoJ-Bold.ttf
      bold_italic: SarasaMonoJ-BoldItalic.ttf
  fallbacks: [Noto Sans JP]

base:
  font-family: Noto Sans JP
  font-size: 10
  line-height-length: 14
  font-color: 000000
  text-align: left

vertical-spacing: 10

prose:
  margin-left: 12
  margin-bottom: 6
  text-indent: 5

link:
  font-color: 414551

caption:
  font-family: Noto Sans JP
  font-size: 8.5
  font-style: bold
  font-color: 303030
  align: center

# Document structure
heading:
  font-family: Noto Sans JP
  font-color: '000000'
  font-style: bold
  line-height: 1.2
  margin-top: 14
  margin-bottom: 7
  h1:
    font-size: 22
  h2:
    font-size: 18
  h3:
    font-size: 16
  h4:
    font-size: 12

title-page:
  background-image: image:../build/cover.svg[]
  align: left
  logo:
    top: 13%
    image: image:../images/sc-logo-ffffff-414551.svg[pdfwidth=60mm]
  title:
    top: 24%
    font-family: Noto Sans JP
    font-size: 29
    font-style: normal
    font-color: FFFFFF
    line-height: 1.3
  subtitle:
    margin-top: 10
    font-family: Noto Sans JP
    font-size: 18
    font-style: normal
    font-color: FFFFFF
  authors:
    display: none
    margin-top: 24
    font-family: Noto Sans JP
    font-size: 10.5
    font-color: FFFFFF

toc:
  font-family: Noto Sans JP
  font-size: 9.5
  line-height: 1.35
  dot-leader:
    font-color: B0BEC5

# Page header and footer
header:
  height: 12mm
  line-height: 1
  border-color: D5D7DC
  border-width: 0.4
  recto:
    left:
      content: '{product-name} {document-title}'
    right:
      content: '{chapter-title}'
  verso:
    left:
      content: '{chapter-title}'
    right:
      content: '{product-name} {document-title}'

footer:
  height: 14mm
  line-height: 1
  border-color: D5D7DC
  border-width: 0.4
  font-family: Noto Sans JP
  font-size: 8
  font-color: 6A6E78
  recto:
    center:
      content: 'Copyright © {copyright-year} Space Cubics Inc.'
    right:
      content: '{page-number} / {page-count}'
  verso:
    left:
      content: '{page-number} / {page-count}'
    center:
      content: 'Copyright © {copyright-year} Space Cubics Inc.'

# Lists
list:
  indent: 18
  item-spacing: 2

# Tables
table:
  font-family: Noto Sans JP
  font-size: 9
  line-height: 1.2
  border-color: 8B8F99
  border-width: 0.5
  grid-width: 0.35
  grid-color: C4C7CE
  cell-padding: [3.5, 4.5, 3.5, 4.5]
  head:
    background-color: E3E4E8
    font-color: 303030
    font-style: bold
  body:
    stripe-background-color: F6F8FA

# Code blocks and inline code
code:
  font-family: Sarasa Mono J
  font-size: 8
  background-color: F5F7F9
  highlight-background-color: FCE8EC
  border-color: CFD8DC
  border-radius: 2
  padding: [2, 4, 2, 4]
  caption:
    font-family: Sarasa Mono J
    font_size: 8
    font_color: #0068b7
    font_style: normal
    margin_bottom: 0
    align: left

codespan:
  font-family: Sarasa Mono J
  font-size: 9
  font-color: E83F5F
  background-color: F1F3F5

conum:
  font-family: Noto Sans JP
  font-size: 8
  font-style: bold
  font-color: 414551
  glyphs: filled
  line-height: 1.2

callout-list:
  font-family: Noto Sans JP
  font-size: 8
  line-height: 1.2

# Admonitions
admonition:
  font-size: 9
  line-height: 1.2
  column-rule-color: 8B8F99
  column-rule-width: 0.8
  label:
    font-family: Noto Sans JP
    font-size: 9
    font-style: bold
    font-color: 414551
  icon:
    note:
      size: 20
    tip:
      size: 20
    important:
      size: 20
    warning:
      size: 20
    caution:
      size: 20
